# =============================================================================
# June Scheduler — 가비아 Nginx 설정 (정적 번들 + 게이트웨이 분리 구조)
# =============================================================================
# 허브 설계자 협의회신(2026-11-20)의 협의안을 그대로 반영한 파일입니다.
# 기존 `nginx-scheduler.conf` 는 GitHub Pages 를 쓰던 시절의 참고용 초안이고,
# 이 파일은 **가비아 실서버에 실제로 설치하는 것**입니다. 둘을 헷갈리지 마세요.
#
# ─────────────────────────────────────────────────────────────────────────────
# 협의회신이 지적한 것 → 이 파일이 대응하는 곳
# ─────────────────────────────────────────────────────────────────────────────
#   "기존 scheduler용 Nginx 예시는 / 전체를 4103으로 프록시합니다.
#    이번 정적 번들·게이트웨이 분리 구조에 그대로 적용하면 안 됩니다."
#     → location / 는 정적 파일만 서빙하고, 프록시는 /api/ 로 한정했습니다.
#
#   "/health 를 정적 파일 경로와 구분해 게이트웨이로 전달해야 합니다."
#     → location = /health (정확 일치 = 는 정적 try_files 보다 우선합니다)
#
#   "WASM MIME, 정적 파일 캐시 정책"
#     → location ~* \.wasm$ 블록
#
#   "8097 인터넷 직접 공개 금지"
#     → upstream 은 127.0.0.1:8097 고정. Nginx 만 그것을 압니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 디렉터리 구조 (협의안 5번 그대로)
# ─────────────────────────────────────────────────────────────────────────────
#   /srv/june7486/sites/scheduler/
#   ├── app/
#   │   └── server/gateway/server.js   ← 게이트웨이 소스
#   ├── public/                        ← build/web 배포 결과 (정적 루트)
#   ├── data/                          ← 로컬 저장 모드의 영구 JSON
#   ├── logs/
#   └── .env                           ← SYNC_SECRET 등 (권한 600)
#
# ─────────────────────────────────────────────────────────────────────────────
# 설치
# ─────────────────────────────────────────────────────────────────────────────
#   sudo install -m 644 nginx-scheduler-gabia.conf \
#        /etc/nginx/sites-available/june-scheduler
#   sudo ln -sf /etc/nginx/sites-available/june-scheduler \
#        /etc/nginx/sites-enabled/june-scheduler
#   sudo nginx -t && sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────
# 설치 직후 검증 (이 순서로)
# ─────────────────────────────────────────────────────────────────────────────
#   ① 문법
#      sudo nginx -t
#
#   ② 정적 파일
#      curl -sSI https://www.aqdesign.co.kr/ | head -3            # 200
#
#   ③ wasm MIME — 이게 틀리면 흰 화면입니다
#      curl -sSI https://www.aqdesign.co.kr/canvaskit/canvaskit.wasm \
#        | grep -i content-type
#      # → content-type: application/wasm
#
#   ④ health 프록시 — 정적 파일이 아니라 게이트웨이가 답해야 합니다
#      curl -sS https://www.aqdesign.co.kr/health
#      # → {"ok":true,"service":"june-nas-gateway","nas":true}
#
#   ⑤ readyz — 503 이 503 으로 보여야 합니다 (Nginx 가 삼키면 안 됨)
#      curl -sS -i https://www.aqdesign.co.kr/readyz | head -1
#
#   ⑥ API prefix 보존 — 404 면 proxy_pass 에 슬래시가 붙은 것입니다
#      curl -sS -o /dev/null -w '%{http_code}\n' \
#        -H "X-Sync-Key: $SYNC_SECRET" \
#        "https://www.aqdesign.co.kr/api/state?ws=TESTWS0001"
#      # → 200 (키가 맞다면)
#
#   ⑦ 게이트웨이가 외부에서 안 닿는지
#      curl -sS -m 3 "http://$(hostname -I | awk '{print $1}'):8097/health" \
#        && echo "❌ 열려 있음" || echo "✅ loopback 만"
# =============================================================================

# ── 업스트림: 게이트웨이 ────────────────────────────────────────────────────
# 127.0.0.1 고정. 이 파일에서 유일하게 8097 이 등장하는 곳입니다.
# keepalive 는 롱폴(wait 최대 20초)에서 연결 재사용을 위해 필요합니다.
upstream june_gateway {
    server 127.0.0.1:8097;
    keepalive 16;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.aqdesign.co.kr aqdesign.co.kr;

    # ACME 챌린지는 반드시 열어둬야 인증서 갱신이 됩니다.
    # 이 location 이 없으면 90일 뒤 인증서가 조용히 만료됩니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.aqdesign.co.kr$request_uri;
    }
}

# ── HTTPS 본 서버 ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.aqdesign.co.kr;

    # 인증서 경로는 발급 방식에 맞게 교체하세요.
    ssl_certificate     /etc/letsencrypt/live/www.aqdesign.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aqdesign.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 보안 헤더 ───────────────────────────────────────────────────────────
    # PWA 이므로 frame-ancestors 를 과하게 조이지 않습니다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── 정적 루트 ───────────────────────────────────────────────────────────
    root /srv/june7486/sites/scheduler/public;
    index index.html;

    # 로그 (협의안의 logs/ 디렉터리를 씁니다)
    access_log /srv/june7486/sites/scheduler/logs/access.log;
    error_log  /srv/june7486/sites/scheduler/logs/error.log warn;

    # =========================================================================
    # ① /health — 게이트웨이로 (정적 파일보다 우선)
    # =========================================================================
    # `= /health` 의 정확 일치는 prefix 매칭(location /)보다 항상 먼저
    # 선택됩니다. 그래서 public/health 에 파일이 있어도 이쪽이 이깁니다.
    # 반대로 `location /health` (등호 없음)로 쓰면 `location /` 와의
    # 우선순위를 사람이 매번 따져야 하므로 등호를 붙였습니다.
    location = /health {
        proxy_pass http://june_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;                       # 초 단위 프로브로 로그를 채우지 않음
        add_header Cache-Control "no-store" always;
    }

    # =========================================================================
    # ② /readyz — 게이트웨이로, 503 을 그대로 통과
    # =========================================================================
    # 기본값인 proxy_intercept_errors off 를 유지합니다. 켜면 게이트웨이의
    # 503 이 Nginx 의 502 로 바뀌어 "준비 안 됨"과 "게이트웨이 죽음"이
    # 구분되지 않습니다. 프록시가 판단해야 하는 정보가 사라지는 셈입니다.
    location = /readyz {
        proxy_pass http://june_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # =========================================================================
    # ③ /api/ — 동기화 API
    # =========================================================================
    # [함정] proxy_pass 에 trailing slash 를 쓰지 마세요.
    #   location /api/ { proxy_pass http://june_gateway; }    ← 정답
    #   location /api/ { proxy_pass http://june_gateway/; }   ← 오답 (전부 404)
    # 슬래시를 붙이면 Nginx 가 /api/state 를 /state 로 바꿔 넘깁니다.
    # 증상이 "게이트웨이는 살아 있는데 앱만 동기화 실패"라서 찾기 어렵습니다.
    location /api/ {
        proxy_pass http://june_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 롱폴: 게이트웨이는 최대 20초(MAX_WAIT_MS) 응답을 붙잡습니다.
        # 클라이언트가 wait=25 로 요청하므로 30초로 잡습니다. 이 값이 짧으면
        # Nginx 가 먼저 끊어 504 를 뱉고 앱은 계속 재시도합니다.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 버퍼링하면 롱폴의 의미가 사라집니다(즉시 반환을 기다리게 됨).
        proxy_buffering off;
        proxy_cache off;
    }

    # =========================================================================
    # ④ .wasm — MIME 이 틀리면 흰 화면
    # =========================================================================
    # CanvasKit 은 wasm 두 개(합계 약 12MB)를 씁니다. MIME 이
    # application/wasm 이 아니면 브라우저가 instantiateStreaming 을 거부하고
    # 앱이 흰 화면으로 남습니다. Nginx 기본 mime.types 에 이 확장자가
    # 없을 수 있으므로 여기서 명시합니다. (이미 있어도 무해)
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # =========================================================================
    # ⑤ 해시된 정적 자산 — 오래 캐시
    # =========================================================================
    # Flutter 는 canvaskit/ 같은 큰 자산을 버전별 경로로 내보냅니다.
    # 교체되지 않는 파일이므로 길게 캐시해도 안전합니다.
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # =========================================================================
    # ⑥ 서비스 워커와 진입점 — 절대 캐시하면 안 됨
    # =========================================================================
    # index.html 이 캐시되면 사용자가 영원히 옛 버전을 봅니다.
    # flutter_service_worker.js 가 캐시되면 새 서비스 워커가 설치되지 않아
    # 업데이트가 영원히 전파되지 않습니다. 이 둘은 반드시 no-cache 입니다.
    #
    # ## version.json 도 여기 넣은 이유
    # 수동 업데이트 확인이 이 파일을 읽습니다. 캐시되면 "최신입니다"라고
    # 답하면서 실제로는 옛 값을 읽는, 조용한 거짓말이 됩니다.
    location ~* ^/(index\.html|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # =========================================================================
    # ⑦ 나머지 — 정적 서빙 + SPA 폴백
    # =========================================================================
    # 이 앱은 URL 라우팅을 쓰지 않으므로 폴백이 사실상 불필요하지만,
    # 나중에 라우팅을 켜면 이 줄이 새로고침 404 를 막습니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
