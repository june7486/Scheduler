# June Scheduler — Nginx 리버스 프록시 설정 초안
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일이 존재하는 이유
# ─────────────────────────────────────────────────────────────────────────────
# 게이트웨이가 이제 loopback(127.0.0.1)에만 바인딩됩니다. 그건 옳지만, 그대로
# 두면 브라우저가 게이트웨이에 닿을 방법이 없습니다. 그래서 Nginx 가 같은
# 출처에서 /api/ 를 대신 받아 넘겨줍니다. 이 구조의 이점은 세 가지입니다.
#
#   1. CORS 가 필요 없어집니다. 앱과 API 가 같은 출처라 브라우저가 프리플라이트를
#      보내지 않습니다. CORS_ORIGINS 를 비워둘 수 있고, 그게 안전한 기본값입니다.
#   2. 게이트웨이가 인터넷에 직접 노출되지 않습니다. 포트 스캔에도 안 잡힙니다.
#   3. TLS 종료가 한 곳에서 일어납니다. 게이트웨이는 인증서를 몰라도 됩니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 반드시 지켜야 하는 세 가지 (설계 검토에서 지적된 것들)
# ─────────────────────────────────────────────────────────────────────────────
#
# ① proxy_pass 에 **trailing slash 를 쓰지 마세요.**
#
#       location /api/ { proxy_pass http://127.0.0.1:8097; }    ← 정답
#       location /api/ { proxy_pass http://127.0.0.1:8097/; }   ← 오답
#
#    슬래시를 붙이면 Nginx 가 `/api/state` 를 `/state` 로 바꿔 넘깁니다.
#    게이트웨이의 라우트는 `/api/state` 이므로 전부 404 가 됩니다.
#    증상이 "게이트웨이는 살아 있는데 앱만 동기화 실패"로 나타나서 찾기 어렵습니다.
#
# ② BASE_PATH 는 비워두세요.
#
#    prefix 제거를 Nginx 가 하므로, 게이트웨이 입장에서는 여전히 `/api/state`
#    입니다. BASE_PATH 를 같이 설정하면 접두사가 두 번 벗겨집니다.
#
# ③ .wasm 은 반드시 application/wasm 으로 나가야 합니다.
#
#    CanvasKit 은 13MB 짜리 wasm 두 개(canvaskit.wasm, canvaskit/chromium/
#    canvaskit.wasm)를 씁니다. MIME 이 틀리면 브라우저가
#    WebAssembly.instantiateStreaming 을 거부하고, 앱이 흰 화면으로 남습니다.
#    Nginx 기본 mime.types 에는 이 확장자가 없을 수 있습니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 적용 위치
# ─────────────────────────────────────────────────────────────────────────────
#   /etc/nginx/sites-available/june-scheduler  (또는 conf.d/*.conf)
#   검증:  sudo nginx -t && sudo systemctl reload nginx
#
# 이 파일은 **초안**입니다. 실제 서버에 적용하기 전에 도메인·인증서 경로·
# 업스트림 포트를 이 환경에 맞게 고쳐야 하며, 운영 서비스에 반영하는 일은
# 반드시 사용자 승인 후에 진행합니다.
# ─────────────────────────────────────────────────────────────────────────────

# ── 업스트림 ────────────────────────────────────────────────────────────────
# 127.0.0.1 고정. 게이트웨이의 HOST 기본값과 짝을 이룹니다.
# keepalive 는 롱폴(wait=25)이 잦은 앱에서 연결 재사용을 위해 필요합니다.
upstream june_gateway {
    server 127.0.0.1:8097;
    keepalive 16;
}

# ── 게이트웨이 API ──────────────────────────────────────────────────────────
# 한 서버 블록에 넣어도 되지만, 분리해두면 https 리다이렉트 블록과 섞이지
# 않습니다. 실제로는 아래 server { } 안에 include 하거나 그대로 붙여넣으세요.
#
# 여기서는 완전한 server 블록 하나로 제시합니다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.aqdesign.co.kr;

    # 환경에 맞게 교체하세요. (예: Let's Encrypt 경로)
    # ssl_certificate     /etc/letsencrypt/live/www.aqdesign.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.aqdesign.co.kr/privkey.pem;

    # ── ① 앱 정적 파일 ──────────────────────────────────────────────────────
    # GitHub Pages 대신 Nginx 가 직접 서빙하는 경우입니다.
    # 지금은 GitHub Pages 가 서빙하므로 이 블록은 참고용입니다.
    root /var/www/june-scheduler;
    index index.html;

    # ── ② 동기화 API 프록시 ─────────────────────────────────────────────────
    # [함정 ①] proxy_pass 에 trailing slash 금지.
    location /api/ {
        proxy_pass http://june_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 원래 호스트를 보존해야 게이트웨이의 로그가 의미를 가집니다.
        # X-Forwarded-Proto 는 나중에 https 판별에 쓸 수 있습니다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Sync-Key 헤더는 기본적으로 그대로 전달됩니다.
        # (proxy_pass_request_headers 는 기본 on — 건드리지 마세요.)

        # 롱폴: 게이트웨이가 최대 20초 응답을 붙잡습니다(MAX_WAIT_MS).
        # 클라이언트가 wait=25 로 요청하므로 30초로 잡습니다.
        # 이 값이 짧으면 Nginx 가 먼저 끊어 504 를 뱉고, 앱은 계속 재시도합니다.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 응답을 버퍼링하면 롱폴의 의미가 사라집니다(즉시 반환을 기다리게 됨).
        proxy_buffering off;
        proxy_cache off;
    }

    # ── ③ 헬스/레디니스 ────────────────────────────────────────────────────
    # `/` 로 끝나지 않는 정확한 경로이므로 `=` 를 씁니다.
    # `/health` 는 GitHub Pages 에 정적 JSON 으로도 게시되지만, 프록시 경유가
    # 가능하면 이쪽이 실시간 값을 줍니다.
    location = /health {
        proxy_pass http://june_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;                 # 1초 주기 프로브로 로그를 채우지 않습니다
        add_header Cache-Control "no-store" always;
    }

    # /readyz 는 프록시가 "지금 트래픽을 받아도 되는가"를 묻는 곳입니다.
    # 503 을 그대로 통과시켜야 의미가 있으므로 proxy_intercept_errors 를 끕니다.
    location = /readyz {
        proxy_pass http://june_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # ── ④ wasm MIME (없으면 흰 화면) ───────────────────────────────────────
    # mime.types 에 없을 때를 대비한 명시 지정입니다.
    # 이미 있으면 중복 선언이지만 무해합니다.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── ⑤ SPA 폴백 ─────────────────────────────────────────────────────────
    # 이 앱은 URL 라우팅을 쓰지 않으므로(index.html 하나) 사실상 불필요하지만,
    # 나중에 라우팅을 켜면 이 줄이 404 를 막습니다.
    # static asset 이 아닌 경로만 index.html 로 돌립니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.aqdesign.co.kr aqdesign.co.kr;

    # ACME 챌린지 경로는 열어둬야 인증서 갱신이 됩니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.aqdesign.co.kr$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 적용 후 확인 (이 순서로)
# ─────────────────────────────────────────────────────────────────────────────
#
#   # 1. 문법
#   sudo nginx -t
#
#   # 2. 게이트웨이가 정말 loopback 에만 있는지 — 외부 IP 로는 닿지 않아야 함
#   curl -sS -m 3 http://$(hostname -I | awk '{print $1}'):8097/health  || echo "OK: 외부에서 안 닿음"
#   curl -sS -m 3 http://127.0.0.1:8097/health                          # 200 이어야 함
#
#   # 3. prefix 가 보존되는지 — 404 면 proxy_pass 에 슬래시가 붙은 것
#   curl -sS -o /dev/null -w '%{http_code}\n' \
#        -H "X-Sync-Key: $SYNC_SECRET" \
#        "https://www.aqdesign.co.kr/api/state?ws=TESTWS0001"          # 200
#
#   # 4. 레디니스가 그대로 통과하는지 (503 이 503 으로 보여야 함)
#   curl -sS -i https://www.aqdesign.co.kr/readyz | head -1
#
#   # 5. wasm MIME
#   curl -sSI https://www.aqdesign.co.kr/canvaskit.wasm | grep -i content-type
#        # application/wasm
#
#   # 6. CORS 를 비워뒀다면 allow-origin 헤더가 없어야 정상 (같은 출처라 불필요)
#   curl -sSI -H "Origin: https://www.aqdesign.co.kr" \
#        https://www.aqdesign.co.kr/health | grep -i access-control || echo "OK: 없음"
# ─────────────────────────────────────────────────────────────────────────────
