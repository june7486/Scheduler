# =============================================================================
# June Scheduler — 공통 보안 헤더 (include 전용 조각)
# =============================================================================
# 설치 위치: /etc/nginx/snippets/june-security-headers.conf
#
#   sudo install -d /etc/nginx/snippets
#   sudo install -m 644 june-security-headers.conf \
#        /etc/nginx/snippets/june-security-headers.conf
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일이 존재하는 이유
# ─────────────────────────────────────────────────────────────────────────────
# Nginx 는 location 블록 안에 add_header 가 하나라도 있으면, 상위(server)
# 블록의 add_header 를 **전부 상속하지 않습니다.** 일부만 빠지는 게 아니라
# 통째로 대체됩니다.
#
# 그래서 server 블록에 3종을 걸어두고 location 안에서 Cache-Control 을 하나
# 지정하면, 그 location 의 응답에서는 3종이 조용히 사라집니다. 오류도 경고도
# 없습니다. curl -I 로 헤더를 직접 세어보기 전까지는 알 수 없습니다.
#
# 해결은 두 가지입니다.
#   (가) 모든 location 에 3종을 손으로 복사  → 빠뜨리기 쉽고, 나중에 추가한
#                                              location 에서 또 샙니다
#   (나) 이 조각을 include                  → 빠뜨릴 수 없습니다
#
# (나)를 씁니다. add_header 를 쓰는 모든 location 은 이 파일을 include 해야
# 합니다. include 는 상속이 아니라 삽입이므로, 위치와 무관하게 항상 적용됩니다.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
