# =============================================================================
# June Scheduler — sch.june7486.com 전용 Nginx 설정
# =============================================================================
# 대상   https://sch.june7486.com  (June's Scheduler 정식 주소)
# 서버   가비아 Ubuntu 24.04  june-main-01
# 기준   2026-11-20
#
# ─────────────────────────────────────────────────────────────────────────────
# 기존 www.aqdesign.co.kr 과의 관계
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일은 **새 주소 하나만** 담당합니다. www.aqdesign.co.kr 은 기존 설정을
# 그대로 유지합니다. 두 파일은 server_name 이 달라 서로 간섭하지 않습니다.
#
#   기존  /etc/nginx/sites-available/<기존 파일>   ← 손대지 않음
#   신규  /etc/nginx/sites-available/june-scheduler-sch
#
# 주의: 기존 설정에 `listen 443 ssl default_server` 가 있으면 여기서 쓰지
# 마세요. default_server 는 한 포트에 하나만 존재할 수 있습니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 디렉터리
# ─────────────────────────────────────────────────────────────────────────────
#   /srv/june7486/sites/scheduler-df225b3/   ← 정적 번들 (이미 배치됨)
#   /srv/june7486/sites/scheduler/data/      ← 영구 JSON (건드리지 않음)
#   /srv/june7486/sites/scheduler/logs/      ← 로그
#
# public/ 심볼릭 링크를 거치지 않고 배포 폴더를 직접 가리킵니다. 링크가
# 없어도 동작하고, 나중에 버전을 갈아끼울 때 root 한 줄만 고치면 됩니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 설치
# ─────────────────────────────────────────────────────────────────────────────
#   sudo install -d /etc/nginx/snippets
#   sudo install -m 644 june-security-headers.conf \
#        /etc/nginx/snippets/june-security-headers.conf
#   sudo install -m 644 nginx-scheduler-sch.conf \
#        /etc/nginx/sites-available/june-scheduler-sch
#   sudo ln -sf /etc/nginx/sites-available/june-scheduler-sch \
#        /etc/nginx/sites-enabled/june-scheduler-sch
#   sudo nginx -t && sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────
# 인증서 순서 — DNS 가 먼저입니다
# ─────────────────────────────────────────────────────────────────────────────
# sch.june7486.com 의 A 레코드가 june-main-01 을 가리키기 전에는 ACME
# 챌린지가 실패합니다. 이 파일을 그대로 켜면 443 블록이 존재하지 않는 인증서
# 파일을 가리켜 nginx -t 가 실패합니다. 그래서 순서는 이렇습니다.
#
#   ① DNS A 레코드 추가 및 전파 확인
#   ② 80 전용 임시 설정으로 인증서만 발급 (아래 명령)
#   ③ 이 파일 설치 → nginx -t → reload
#
#   ②의 명령:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d sch.june7486.com
#
# 기존 ACME 경로(/var/www/certbot)를 그대로 씁니다. 새 디렉터리를 만들지
# 않으므로 기존 인증서 갱신과 충돌하지 않습니다.
# =============================================================================

# ── 업스트림 ────────────────────────────────────────────────────────────────
# 127.0.0.1 고정. 이 파일에서 8097 이 등장하는 유일한 곳입니다.
# 게이트웨이는 loopback 에만 있고, Nginx 만 그것을 압니다.
upstream june_gateway_sch {
    server 127.0.0.1:8097;
    keepalive 16;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sch.june7486.com;

    # ACME 챌린지는 반드시 열어둬야 인증서 갱신이 됩니다.
    # 이 location 이 없으면 90일 뒤 인증서가 조용히 만료됩니다.
    # 기존 사이트와 같은 경로를 씁니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sch.june7486.com$request_uri;
    }
}

# ── HTTPS 본 서버 ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name sch.june7486.com;

    ssl_certificate     /etc/letsencrypt/live/sch.june7486.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sch.june7486.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 보안 헤더 (server 레벨) ─────────────────────────────────────────────
    # add_header 를 쓰지 않는 응답(정적 파일 등)은 여기 것이 그대로 적용됩니다.
    # add_header 를 쓰는 location 은 아래에서 snippet 을 include 해서
    # 같은 3종을 다시 겁니다. (Nginx 는 location 에 add_header 가 있으면
    # server 레벨을 상속하지 않습니다 — 그게 이 구조를 만든 이유입니다.)
    include /etc/nginx/snippets/june-security-headers.conf;

    # ── 정적 루트 ───────────────────────────────────────────────────────────
    root /srv/june7486/sites/scheduler-df225b3;
    index index.html;

    # ── 로그 ────────────────────────────────────────────────────────────────
    access_log /srv/june7486/sites/scheduler/logs/sch-access.log;
    error_log  /srv/june7486/sites/scheduler/logs/sch-error.log warn;

    # =========================================================================
    # ① /health — 게이트웨이로. 정적 파일보다 우선합니다.
    # =========================================================================
    # `= /health` 의 정확 일치는 prefix 매칭(location /)보다 항상 먼저
    # 선택됩니다. public/ 에 health 라는 파일이 있어도 이쪽이 이깁니다.
    #
    # 응답의 service / nas 두 필드는 **그대로 통과**시킵니다. 앱이 이 두
    # 값을 게이트웨이 식별에 실제로 쓰기 때문입니다. 이름이 NAS 시절 그대로인
    # 것은 알려진 사항이고, 바꾸면 앱 재빌드가 필요하므로 유지합니다.
    location = /health {
        proxy_pass http://june_gateway_sch;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        access_log off;                   # 초 단위 프로브로 로그를 채우지 않음
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/june-security-headers.conf;
    }

    # =========================================================================
    # ② /readyz — 게이트웨이로. 503 을 503 으로 통과시킵니다.
    # =========================================================================
    # proxy_intercept_errors 는 기본값 off 를 유지합니다. 켜면 게이트웨이의
    # 503 이 Nginx 의 502 로 바뀌어 "준비 안 됨"과 "게이트웨이 죽음"이
    # 구분되지 않습니다. 그 구분이 이 엔드포인트의 존재 이유입니다.
    location = /readyz {
        proxy_pass http://june_gateway_sch;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/june-security-headers.conf;
    }

    # =========================================================================
    # ③ /api/ — 동기화 API. 접두사를 보존합니다.
    # =========================================================================
    # [함정] proxy_pass 에 trailing slash 를 쓰지 마세요.
    #   location /api/ { proxy_pass http://june_gateway_sch; }    ← 정답
    #   location /api/ { proxy_pass http://june_gateway_sch/; }   ← 오답
    # 슬래시를 붙이면 Nginx 가 /api/state 를 /state 로 바꿔 넘깁니다.
    # 증상이 "게이트웨이는 살아 있는데 앱만 동기화 실패"라서 찾기 어렵습니다.
    location /api/ {
        proxy_pass http://june_gateway_sch;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 롱폴: 게이트웨이는 최대 20초(MAX_WAIT_MS) 응답을 붙잡습니다.
        # 클라이언트가 wait=25 로 요청하므로 30초로 잡습니다. 짧으면 Nginx 가
        # 먼저 끊어 504 를 뱉고 앱은 계속 재시도합니다.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 버퍼링하면 롱폴의 의미가 사라집니다(즉시 반환을 기다리게 됨).
        proxy_buffering off;
        proxy_cache off;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/june-security-headers.conf;
    }

    # =========================================================================
    # ④ .wasm — MIME 이 틀리면 흰 화면
    # =========================================================================
    # CanvasKit 은 wasm 을 씁니다. MIME 이 application/wasm 이 아니면
    # 브라우저가 instantiateStreaming 을 거부하고 앱이 흰 화면으로 남습니다.
    # Nginx 기본 mime.types 에 이 확장자가 없을 수 있어 여기서 명시합니다.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/june-security-headers.conf;
        try_files $uri =404;
    }

    # =========================================================================
    # ⑤ 해시된 정적 자산 — 오래 캐시
    # =========================================================================
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/june-security-headers.conf;
        try_files $uri =404;
    }

    # =========================================================================
    # ⑥ 서비스 워커와 진입점 — 절대 캐시하면 안 됨
    # =========================================================================
    # index.html 이 캐시되면 사용자가 영원히 옛 버전을 봅니다.
    # flutter_service_worker.js 가 캐시되면 새 워커가 설치되지 않아
    # 업데이트가 영원히 전파되지 않습니다.
    # version.json 은 수동 업데이트 확인이 읽습니다. 캐시되면 "최신입니다"라고
    # 답하면서 실제로는 옛 값을 읽는, 조용한 거짓말이 됩니다.
    location ~* ^/(index\.html|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/june-security-headers.conf;
        try_files $uri =404;
    }

    # =========================================================================
    # ⑦ 나머지 — 정적 서빙 + SPA 폴백
    # =========================================================================
    # 이 앱은 URL 라우팅을 쓰지 않으므로 폴백이 사실상 불필요하지만,
    # 나중에 라우팅을 켜면 이 줄이 새로고침 404 를 막습니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
