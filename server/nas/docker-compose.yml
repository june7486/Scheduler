# June Scheduler — NAS sync server (Docker Compose)
#
# 1. 이 파일과 server.js 를 NAS의 같은 폴더에 둡니다.
#    예: /volume1/docker/june-sync/
# 2. 아래 SYNC_SECRET 을 충분히 긴 임의의 문자열로 바꿉니다.
#      openssl rand -base64 32
# 3. docker compose up -d
#
# 확인:  curl http://NAS주소:8099/health
services:
  june-sync:
    build: .
    container_name: june-sync
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      # 외부에 포트를 열 계획이라면 반드시 설정하세요.
      # 비워두면 서버가 누구에게나 열립니다.
      SYNC_SECRET: "여기에-충분히-긴-임의의-문자열"
      DATA_DIR: /data
      PORT: "8099"
    volumes:
      # 왼쪽(호스트 경로)만 NAS 환경에 맞게 바꾸면 됩니다.
      # 데이터가 계정당 JSON 파일 1개로 여기에 쌓입니다.
      - /volume1/docker/june-sync/data:/data
