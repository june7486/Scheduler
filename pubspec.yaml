name: june_scheduler
description: "June's Scheduler - All-in-one personal & business task scheduler."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  web: ^1.1.1
  uuid: ^4.5.1
  http: ^1.5.0

  # Export / print
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  screenshot: ^3.0.0

  # Voice note
  record: ^5.2.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Fonts (all open-source). Hand-writing scripts + typographic families.
  fonts:
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gaegu-Bold.ttf
          weight: 700
    - family: NanumPen
      fonts:
        - asset: assets/fonts/NanumPenScript-Regular.ttf
          weight: 400
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumMyeongjo-Bold.ttf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
          weight: 400
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 400
    - family: DoHyeon
      fonts:
        - asset: assets/fonts/DoHyeon-Regular.ttf
          weight: 400
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
          weight: 400
