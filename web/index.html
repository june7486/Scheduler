<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="June's Scheduler">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>June's Scheduler</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- ==========================================================================
       강제 업데이트 함수
       ==========================================================================
       앱이 "지금 업데이트"를 눌렀을 때 부르는 곳입니다. Dart 에서 브라우저
       캐시를 직접 비울 방법이 없어서, 이 작은 함수에 맡깁니다.

       ## 순서가 중요합니다
       1) 서비스 워커 등록 해제 — 새 워커가 설치될 자리를 비웁니다
       2) CacheStorage 비우기 — 옛 번들이 남아 있지 않게 합니다
       3) 캐시 무시 쿼리로 이동 — 브라우저가 서버에서 다시 받습니다

       ## 왜 location.reload(true) 를 안 쓰는가
       그 인자는 오래전에 무시되었고, 지금은 deprecated 입니다. 그리고
       서비스 워커가 살아 있으면 reload 만으로는 옛 캐시를 계속 씁니다.
       그래서 캐시를 실제로 지우는 단계가 필요합니다.

       ## 실패해도 새로고침은 합니다
       다른 탭이 서비스 워커를 잡고 있으면 unregister 가 실패할 수 있습니다.
       그때 멈추면 사용자는 "눌렀는데 아무 일도 안 일어났다"고 느낍니다.
       그래서 모든 단계를 try 로 감싸고, 마지막 줄은 무조건 실행합니다.
       ========================================================================== -->
  <script>
    window.juneForceUpdate = function () {
      var done = false;
      var finish = function () {
        if (done) return;
        done = true;
        // 캐시 무시 쿼리. 주소는 그대로 두고 쿼리만 붙입니다.
        var u = new URL(window.location.href);
        u.searchParams.set('_u', Date.now().toString());
        window.location.replace(u.toString());
      };

      // 3초 안에 못 끝내면 그냥 새로고침합니다. 사용자를 기다리게 하지 않습니다.
      var guard = setTimeout(finish, 3000);

      try {
        var jobs = [];

        if ('serviceWorker' in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
              .catch(function () {})
          );
        }

        if (window.caches && caches.keys) {
          jobs.push(
            caches.keys()
              .then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
              .catch(function () {})
          );
        }

        Promise.all(jobs).then(function () {
          clearTimeout(guard);
          finish();
        }).catch(function () {
          clearTimeout(guard);
          finish();
        });
      } catch (e) {
        clearTimeout(guard);
        finish();
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
